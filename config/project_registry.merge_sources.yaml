    count_as_active_projects: false
  automation:
    worker_allowed_by_default: false
    allow_task_generation: true
    allowed_task_types:
    - merge_review
    - compatibility_audit
    - source_inventory
    - migration_plan
  merge_policy:
    automatic_merge_allowed: false
    require_human_review: true
    require_target_branch: true
    require_patch_diff: true
    require_validation_log: true
    require_debrief: true
    require_promotion_gate: true
