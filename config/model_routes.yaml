version: 1

defaults:
  local_first: true
  require_human_approval_for_remote: true
  remote_outputs_are_read_only: true
  local_outputs_require_approval: true

# ── Local Ollama models (used first, zero cost) ───────────────────────────────
# Hardware: NVIDIA GB10 (DGX Spark) — 128GB unified memory.
# Can run 70B models. See upgrade recommendations at bottom.
local_models:
  coder:
    provider: ollama
    model: qwen3-coder:30b        # PRIMARY coder — Qwen3 gen, thinking mode, 30B MoE
    use_for:
      - implementation
      - tests
      - bugfixes
      - hard_bugfixes
      - architecture_check
      - test_failures
      - planning
      - small_refactors
      - targeted_fixes
      - minimal_patches

  fast_coder:
    provider: ollama
    model: devstral:latest        # Fast coder for small patches, 24B, lower latency
    use_for:
      - fast_patch
      - docstrings
      - rename_only

  summaries:
    provider: ollama
    model: qwen3.6:latest         # Qwen3 36B MoE — fast general model
    use_for:
      - summaries
      - documentation
      - closeout
      - stable_small_edits
      - compact

  research:
    provider: ollama
    model: nemotron-3-nano:30b-a3b-q4_K_M   # NVIDIA MoE, good for analysis
    use_for:
      - review
      - risk_review
      - research

# ── Local model upgrade path (128GB GB10 can handle 70B easily) ──────────────
# REMOVE (redundant, older than qwen3-coder:30b):
#   ollama rm qwen2.5-coder:32b
#
# UPGRADE — pull one 70B class model for heavy local reasoning:
#   ollama pull qwen3:72b          # Best all-round, thinking mode (42GB Q4)
#   ollama pull deepseek-r1:70b    # Best local reasoning / reflection (40GB Q4)
#   ollama pull llama3.3:70b       # Meta flagship, broad capability (40GB Q4)

# ── NVIDIA NIM free endpoints (NVIDIA_API_KEY required) ──────────────────────
# All confirmed working on this account. Free tier with rate limits.
remote_models:

  deepseek_v4_pro:
    provider: nvidia_nim
    model: deepseek-ai/deepseek-v4-pro
    use_for:
      - hard_debugging
      - large_coding_plan
      - multi_file_refactor_plan
      - long_context_coding
      - repo_wide_analysis
    trigger_tags:
      - "#deepseek"
      - "#hard_debug"
      - "#long_context"
      - "#repo_wide"
    notes: DeepSeek V4 Pro — best coding quality on NIM. Use for hard tasks.

  deepseek_v4_flash:
    provider: nvidia_nim
    model: deepseek-ai/deepseek-v4-flash
    use_for:
      - fast_coding
      - quick_fix
    trigger_tags:
      - "#fast"
      - "#quick"
    notes: Faster DeepSeek V4. Good for quick tasks where Pro is overkill.

  nemotron_ultra:
    provider: nvidia_nim
    model: nvidia/nemotron-3-ultra-550b-a55b
    use_for:
      - architecture_review
      - deep_repo_analysis
      - high_level_planning
      - complex_agent_tasks
      - strategic_reasoning
    trigger_tags:
      - "#planning"
      - "#architecture"
      - "#strategic"
      - "#deep_analysis"
    notes: 550B MoE, ~55B active — best free flagship reasoner on NIM.

  nemotron_super_120b:
    provider: nvidia_nim
    model: nvidia/nemotron-3-super-120b-a12b
    use_for:
      - balanced_coding
      - agentic_planning
    trigger_tags:
      - "#nemotron"
      - "#agentic"
    notes: 120B MoE, ~12B active — fast and capable, good default remote.

  nemotron_49b:
    provider: nvidia_nim
    model: nvidia/llama-3.3-nemotron-super-49b-v1
    use_for:
      - agent_planning
      - tool_use
    trigger_tags:
      - "#agent"
      - "#tools"
    notes: NVIDIA fine-tuned Llama 3.3 for agentic tool use.

  llama4_maverick:
    provider: nvidia_nim
    model: meta/llama-4-maverick-17b-128e-instruct
    use_for:
      - fast_general
      - chat
    trigger_tags:
      - "#llama4"
      - "#maverick"
    notes: Llama 4 Maverick 17Bx128E MoE — fast, great for general tasks.

  qwen3_next_80b:
    provider: nvidia_nim
    model: qwen/qwen3-next-80b-a3b-instruct
    use_for:
      - coding_plan
      - test_strategy
    trigger_tags:
      - "#qwen"
      - "#coding_plan"
    notes: Qwen3 Next 80B — strong at structured coding plans.

  mistral_small_119b:
    provider: nvidia_nim
    model: mistralai/mistral-small-4-119b-2603
    use_for:
      - balanced_general
      - summarization
    trigger_tags:
      - "#mistral"
      - "#summarize"
    notes: Mistral Small 4 119B MoE — fast, broad capability.

# ── HuggingFace Router (HF_TOKEN required, free with account) ────────────────
hf_models:
  default:
    provider: huggingface_router
    model: meta-llama/Llama-3.3-70B-Instruct
    use_for:
      - general_fallback
    notes: Serverless fallback when Ollama is unavailable. Free with HF account.

# ── Quantum / domain-specific NIM models ─────────────────────────────────────
quantum_models:
  ising_calibration:
    provider: nvidia_nim
    model: nvidia/ising-calibration-1-35b-a3b
    use_for:
      - quantum_calibration_plot_analysis
      - qpu_status_interpretation
      - structured_calibration_report
    trigger_tags:
      - "#ising"
      - "#calibration"
      - "#qec_plots"
      - "#quantum_chart_analysis"
