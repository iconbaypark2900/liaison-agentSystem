    count_as_active_projects: false
  automation:
    worker_allowed_by_default: false
    allow_task_generation: true
    allowed_task_types:
    - archive_review
    - restore_review
    - archive_inventory
    - restore_plan
  restore_policy:
    automatic_restore_allowed: false
    require_human_review: true
    require_archive_inventory: true
    require_restore_recommendation: true
    require_validation_plan: true
    require_promotion_gate: true
    default_gate_status: review_required
    restored_projects_must_move_to_active_registry_manually: true
  promotion_policy:
    standalone_promotion_allowed: false
    production_allowed: false
    customer_release_allowed: false
    live_allowed: false
    requires_human_approval: true
