version: 1
workflows:
  reporter-mode:
    role: default universal work filesystem path
    commands:
      - init
      - snapshot
      - attach
      - approve-artifact
      - reject-artifact
      - decision
      - validate
      - close-task
  phase-executor:
    role: optional legacy executor lane
    commands:
      - start
      - approve
      - reject
  python-cli:
    role: generic Python project lifecycle
  quantum-ising:
    role: quantum calibration or decoding workflow
  data-flywheel:
    role: continuous agent optimization loop based on production traffic, curated datasets, candidate model experiments, and deterministic/LLM-judge evaluation reports
    commands:
      - init
      - snapshot
      - attach
      - score-artifacts
      - evaluate
      - approve-artifact
      - decision
      - trend-report
      - dashboard
      - close-task
  rag-app:
    role: retrieval-augmented generation application lifecycle (plan, corpus, retrieval, validate, review, close)
  quantum-benchmarks:
    role: quantum benchmark runs across backends and decoders (plan, setup, run, validate, analyze, close)
  ml-research:
    role: machine learning research experiment lifecycle (plan, data, run, validate, analyze, close)
  frontend-app:
    role: frontend application lifecycle (plan, scaffold, implement, validate, review, close)
  backend-app:
    role: backend service lifecycle (plan, scaffold, implement, validate, review, close)
  scientific-paper:
    role: scientific paper or technical report lifecycle (outline, evidence, draft, review, revise, approve, submit, close)
  portfolio-optimizer:
    role: portfolio optimization strategy lifecycle (plan, data, backtest, risk, validate, paper-trade, live, close)
  qids:
    role: quantum-inspired decision system module lifecycle (plan, design, calibrate, validate, integrate, close)
