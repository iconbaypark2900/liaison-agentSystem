version: 0.2.0
secret_handling:
  raw_secret_values_forbidden_in_prompts: true
  raw_secret_values_forbidden_in_artifacts: true
  raw_secret_values_forbidden_in_logs: true
  forbidden_secret_types:
  - IBM Quantum tokens
  - API keys
  - Fernet keys
  - integration encryption keys
  - SSH private keys
  - GitHub tokens
  - provider API keys
  - production database credentials
  allowed_references:
  - environment variable names
  - config key names
  - settings screen names
  - secret manager references
  - local-only placeholder values
  forbidden_paths:
  - .env
  - .env.*
  - secrets/
  - credentials/
  - customer_data/
  - prod_dumps/
  - '*.pem'
  - '*.key'
  - id_rsa
  - id_ed25519
