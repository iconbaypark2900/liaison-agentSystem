name: sigma-integration
version: 1
description: >
  Reporter-first workflow for tradeFluxsimulator archive inspection and
  incremental migration into the Sigma trading platform.
layer: L1
status: actionable

principles:
  - archive inspection is read-only and hermes-led
  - module validation runs checks/sigma.sh before any merge consideration
  - each slice produces a hermes report and a validation artifact
  - L4 merge requires human approval and a clean validation gate

phases:
  - id: archive-inspect
    label: Archive inspection (read-only)
    route: reviewer
    agent: hermes
    skills:
      - spark-flow-planning
    liaison_commands:
      - liaison init sigma-tfs-<n> "<slice goal>"
      - liaison snapshot --show
      - liaison attach hermes --text "<assessment>"
      - liaison decision "<operator scope decision>"
    artifacts:
      - hermes-report.md
    approval: required

  - id: module-validate
    label: Module validation
    kind: deterministic
    validate_profile: sigma
    agent: hermes
    skills:
      - testing-hardening
    liaison_commands:
      - liaison validate --profile sigma
      - liaison gate --show
    artifacts:
      - test.sigma.md
    approval: required

  - id: review
    label: Review
    route: reviewer
    skills:
      - spark-flow-review
    approval: required

  - id: closeout
    label: Reporter closeout
    route: stable
    agent: operator
    skills:
      - spark-flow-closeout
    liaison_commands:
      - liaison close-task --summary "<outcome; next steps for L4 merge>"
    approval: required

quality_gates:
  required:
    - hermes report covers archive structure, dependencies, and migration risks
    - checks/sigma.sh passes with at least 200 tests
    - validation gate is not blocked before closeout
    - human approval exists before L4 merge consideration

validation_profile: sigma
checks_script: checks/sigma.sh
project_guide: ~/spark/docs/local-agents/projects/sigma-integration.md
merge_layer: L4
