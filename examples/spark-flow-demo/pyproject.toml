[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spark-flow-demo"
version = "0.1.0"
description = "A demo project for testing the DGX Spark local multi-model workflow"
authors = [
    {name = "Spark Flow Demo"}
]
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
]

[project.scripts]
spark-demo-health = "spark_flow_demo.cli:main"

[project.urls]
Homepage = "https://github.com"