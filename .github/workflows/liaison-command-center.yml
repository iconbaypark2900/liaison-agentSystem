name: liaison-command-center

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      # The command-center loads the spark-flow bridge from the live control
      # plane root. Without this it resolves to ~/spark/agent-system, which
      # does not exist on a runner; bin/spark-flow ships in this repo, so
      # point it at the checkout.
      LIAISON_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python deps
        run: pip install -r requirements.txt
      - name: command-center data tests
        run: python3 tests/test_command_center_data.py
      - name: command-center JSON smoke
        run: bash tests/test_command_center_json.sh

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/web/package-lock.json
      - run: npm ci
      - run: npm test -- --run
